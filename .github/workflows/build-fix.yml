name: build-patched
on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install deps
        run: bun install

      - name: Build CLI (baseline — no AVX2)
        run: cd packages/opencode && bun run build -- --baseline

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: opencode-linux-x64-baseline
          path: packages/opencode/dist/opencode-linux-x64-baseline/bin/opencode
