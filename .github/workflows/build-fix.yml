name: build-patched
on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install deps
        run: bun install

      - name: Build CLI
        run: cd packages/opencode && bun run build

      - name: Show built files
        run: find packages/opencode/dist -type f -executable 2>/dev/null || find packages/opencode/dist -name "opencode" 2>/dev/null || echo "checking bin..." && ls -la packages/opencode/bin/

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: opencode-linux-x64
          path: packages/opencode/dist/opencode-linux-x64/bin/opencode
